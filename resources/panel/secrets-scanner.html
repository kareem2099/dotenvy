<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: https:; font-src 'self' data: https:; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{STYLE_URI}}" rel="stylesheet">
    <link href="{{EXTRA_STYLE_URI}}" rel="stylesheet">
    <title>{{TITLE}}</title>
</head>
<body>
    <div class="header">
        <div class="header-title">🔍 <span>DotEnvy</span> — {{HEADER_TITLE}}</div>
        <div class="stats">
            <div class="stat stat-all active"   data-action="filter" data-filter="all">{{ALL_LABEL}} <span class="count-badge">{{ALL_COUNT}}</span></div>
            <div class="stat stat-high {{HIGH_ACTIVE}}"   data-action="filter" data-filter="high">{{HIGH_LABEL}} <span class="count-badge">{{HIGH_COUNT}}</span></div>
            <div class="stat stat-medium {{MEDIUM_ACTIVE}}" data-action="filter" data-filter="medium">{{MEDIUM_LABEL}} <span class="count-badge">{{MEDIUM_COUNT}}</span></div>
            <div class="stat stat-low {{LOW_ACTIVE}}"   data-action="filter" data-filter="low">{{LOW_LABEL}} <span class="count-badge">{{LOW_COUNT}}</span></div>
        </div>
    </div>
    <div class="filter-bar">
        <input id="search-input" type="text" placeholder="{{SEARCH_PLACEHOLDER}}">
    </div>
    
    {{STATS_HINT}}
    {{SECRETS_CONTENT}}

    <script type="application/json" id="secrets-data">
        {{JSON_SECRETS}}
    </script>
    <script nonce="{{NONCE}}">
        const vscode = acquireVsCodeApi();
        const secrets = JSON.parse(document.getElementById('secrets-data').textContent || '[]');
        let f = 'all', q = '';

        // ── Action delegation (replaces inline onclick/oninput, CSP-safe) ──
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) { return; }
            const action = btn.getAttribute('data-action');
            if (action === 'filter') { filterBy(btn.getAttribute('data-filter')); return; }
            const i = parseInt(btn.getAttribute('data-index'), 10);
            if (isNaN(i) || !secrets[i]) { return; }
            if (action === 'view')   { vscode.postMessage({ type: 'viewLocation', secret: secrets[i] }); }
            if (action === 'move')   { vscode.postMessage({ type: 'moveToEnv',    secret: secrets[i] }); }
            if (action === 'ignore') { vscode.postMessage({ type: 'ignore',       secret: secrets[i] }); }
        });

        document.getElementById('search-input').addEventListener('input', function() {
            filterSearch(this.value);
        });

        function filterBy(l) {
            f = l;
            applyFilters();
            document.querySelectorAll('.stat').forEach(e => {
                const isMatch = e.getAttribute('data-filter') === l;
                e.classList.toggle('active', isMatch);
                e.classList.toggle('inactive', !isMatch);
            });
        }

        function filterSearch(v) {
            q = v.toLowerCase();
            applyFilters();
        }

        function applyFilters() {
            document.querySelectorAll('.secret-row').forEach(row => {
                const c = row.getAttribute('data-confidence');
                const i = parseInt(row.getAttribute('data-index'), 10);
                const s = secrets[i];
                const text = (s.file + s.type + s.suggestedEnvVar + s.content).toLowerCase();
                const matchConf = (f === 'all' || c === f);
                const matchSearch = (!q || text.includes(q));
                row.style.display = (matchConf && matchSearch) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
