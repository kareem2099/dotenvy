<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: https:; font-src 'self' data: https:; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{STYLE_URI}}" rel="stylesheet">
    <title data-i18n="trash.title">Session Trash Bin</title>
</head>
<body>
    <div class="trash-bin-container">
        <div class="trash-header">
            <div class="trash-header-main">
                <div class="trash-title-row">
                    <h3>
                        <span class="trash-header-icon" aria-hidden="true">🗑️</span>
                        <span data-i18n="trash.title">Session Trash Bin</span>
                    </h3>
                    <span class="trash-count" id="trash-count">0</span>
                </div>
                <p class="trash-subtitle" data-i18n="trash.subtitle">Variables deleted or modified this session. Clears on VS Code restart.</p>
            </div>
            <div class="trash-header-actions">
                <button type="button" class="btn btn-secondary" id="clear-all-btn" data-i18n="trash.clearAll">🗑 Clear All</button>
            </div>
        </div>
        <div class="trash-list" id="trash-list">
            <div class="trash-empty" data-i18n="trash.empty">🎉 Nothing in the bin — your variables are safe!</div>
        </div>
    </div>
    <script nonce="{{NONCE}}" src="{{I18N_SCRIPT_URI}}"></script>
    <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
