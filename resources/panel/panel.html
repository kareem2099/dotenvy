<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="panel.title">dotenvy - Environment Manager</title>
    <link rel="stylesheet" href="{{panelCssUri}}">
</head>

<body>
    <div class="setup-section" id="setup-section" hidden>
        <div class="setup-card">
            <h3 class="setup-title" id="setup-title" data-i18n="panel.setup.getStarted">Get started with DotEnvy</h3>
            <p class="setup-description" id="setup-description" data-i18n="panel.setup.description">Initialize the extension to start managing your environments.</p>
            <div class="setup-actions" id="setup-actions"></div>
        </div>
    </div>
    <div class="header animate-fade-in">
        <h2>
            <span class="logo-icon">🚀</span>
            <span data-i18n="panel.header.title">dotenvy Environment Manager</span>
        </h2>
        <div class="header-actions">
            <button class="btn btn-secondary btn-sm" id="btn-doppler" onclick="openDopplerDashboard()"
                data-i18n-title="panel.actions.dopplerTip">
                <span>🌐</span> <span data-i18n="panel.actions.doppler">Doppler</span>
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-history" onclick="openHistoryPanel()"
                data-i18n-title="panel.actions.historyTip">
                <span>🕐</span> <span data-i18n="panel.actions.history">History</span>
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-analytics" onclick="openAnalyticsPanel()" data-i18n-title="panel.actions.analyticsTip">
                <span>📈</span> <span data-i18n="panel.actions.analytics">Analytics</span>
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-trash" onclick="openTrashBin()" data-i18n-title="panel.actions.trashTip">
                <span>🗑️</span> <span data-i18n="panel.actions.trash">Trash Bin</span>
            </button>
            <button class="btn btn-danger btn-sm" id="btn-scan" onclick="scanSecrets()"
                data-i18n-title="panel.actions.scanTip">
                <span class="scan-icon">🔍</span> <span data-i18n="panel.actions.scan">Scan Secrets</span>
            </button>
            <button class="btn btn-primary btn-sm" id="btn-pull" onclick="pullFromCloud()">
                <span class="sync-icon" id="sync-icon">☁️</span> <span data-i18n="panel.actions.pull">Pull from Cloud</span>
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-push" onclick="pushToCloud()">
                <span class="sync-icon" id="push-icon">⬆️</span> <span data-i18n="panel.actions.push">Push to Cloud</span>
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-githook" onclick="manageGitHook()">
                <span class="hook-icon" id="hook-icon">🔗</span> <span data-i18n="panel.actions.gitHook">Git Hook</span>
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-validate" onclick="validateEnvironments()">
                <span class="validate-icon" id="validate-icon">✅</span> <span data-i18n="panel.actions.validate">Validate</span>
            </button>
        </div>
        <div class="header-language-divider" aria-hidden="true"></div>
        <div class="header-language">
            <label class="language-label" for="locale-dropdown-trigger" data-i18n="panel.language.label">Language</label>
            <div class="locale-dropdown" id="locale-dropdown">
                <button
                    type="button"
                    id="locale-dropdown-trigger"
                    class="locale-dropdown-trigger"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="locale-dropdown-menu">
                    <span class="locale-dropdown-value" id="locale-dropdown-value">English</span>
                    <span class="locale-dropdown-chevron" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="dashboard-grid">
            <div class="dashboard-card cloud-card">
                <div class="card-header">
                    <span class="card-icon">☁️</span>
                    <span class="card-title" data-i18n="panel.cloud.title">Cloud Sync</span>
                </div>
                <div class="card-content">
                    <div class="sync-status">
                        <span class="status-indicator status-disconnected" id="cloud-status" data-i18n="panel.cloud.notConnected">Not Connected</span>
                    </div>
                    <div class="sync-last">
                        <span class="sync-time" id="last-sync"></span>
                    </div>
                </div>
            </div>

            <div class="dashboard-card git-card">
                <div class="card-header">
                    <span class="card-icon">🔗</span>
                    <span class="card-title" data-i18n="panel.git.title">Git Hook</span>
                </div>
                <div class="card-content">
                    <div class="hook-status">
                        <span class="status-indicator status-warning" id="hook-status" data-i18n="panel.git.notInstalled">Not Installed</span>
                    </div>
                    <div class="hook-actions">
                        <button class="btn btn-sm btn-secondary" id="btn-install-hook" onclick="installHook()" data-i18n="panel.git.install">Install</button>
                        <button class="btn btn-sm btn-secondary" id="btn-remove-hook" onclick="removeHook()" data-i18n="panel.git.remove">Remove</button>
                    </div>
                </div>
            </div>

            <div class="dashboard-card validation-card">
                <div class="card-header">
                    <span class="card-icon">✅</span>
                    <span class="card-title" data-i18n="panel.validation.title">Validation</span>
                </div>
                <div class="card-content">
                    <div class="validation-status">
                        <span class="status-indicator status-valid" id="validation-status" data-i18n="panel.validation.valid">Valid</span>
                    </div>
                    <div class="validation-errors" id="validation-errors" style="display: none;">
                        <span class="error-count"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="environments" id="environments">
        <div class="section-header">
            <h3 data-i18n="panel.environments.title">Available Environments</h3>
            <button class="btn btn-primary btn-sm" id="btn-create-env" onclick="createEnvFile()" data-i18n="panel.environments.create">Create Environment</button>
        </div>
        <div class="environments-grid" id="environments-list">
            <p data-i18n="panel.environments.loading">Loading environments...</p>
        </div>
    </div>

    <div class="backup-section" id="backup-section">
        <div class="section-header">
            <h3 data-i18n="panel.backup.title">Backup Settings</h3>
        </div>
        <div class="backup-settings" id="backup-settings">
            <div class="setting-item">
                <label><span data-i18n="panel.backup.location">Backup Location:</span> <span id="backup-path-display" data-i18n="panel.backup.defaultPath">Default (~/.dotenvy-backups)</span></label>
            </div>
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="encrypt-backups-checkbox"> <span data-i18n="panel.backup.encrypt">Encrypt Backups</span>
                </label>
            </div>
        </div>
    </div>
    <div class="locale-dropdown-menu" id="locale-dropdown-menu" role="listbox" hidden>
        <button type="button" class="locale-dropdown-option" role="option" data-locale="en" data-i18n="panel.language.en">English</button>
        <button type="button" class="locale-dropdown-option" role="option" data-locale="it" data-i18n="panel.language.it">Italiano</button>
        <button type="button" class="locale-dropdown-option" role="option" data-locale="ar" data-i18n="panel.language.ar">العربية</button>
        <button type="button" class="locale-dropdown-option" role="option" data-locale="ru" data-i18n="panel.language.ru">Русский</button>
    </div>
    <script src="{{panelJsUri}}"></script>
</body>

</html>
